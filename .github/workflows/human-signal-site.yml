name: Human Signal site checks and deployment

on:
  push:
    branches: [main]
    paths:
      - 'human-signal-site/**'
      - 'HUMAN_SIGNAL.md'
      - '.github/ISSUE_TEMPLATE/human-signal.yml'
      - 'scripts/validateHumanSignalSite.js'
      - '.github/workflows/human-signal-site.yml'
  pull_request:
    paths:
      - 'human-signal-site/**'
      - 'HUMAN_SIGNAL.md'
      - '.github/ISSUE_TEMPLATE/human-signal.yml'
      - 'scripts/validateHumanSignalSite.js'
      - '.github/workflows/human-signal-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed repository content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate static website and contact links
        run: node scripts/validateHumanSignalSite.js

      - name: Check deployment prerequisites
        id: deployment_gate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_CLI_VERSION" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Human Signal site checks passed, but Vercel deployment is disabled until VERCEL_TOKEN and VERCEL_CLI_VERSION are configured.'
          fi

      - name: Install reviewed Vercel CLI version
        if: steps.deployment_gate.outputs.configured == 'true'
        env:
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
        run: npm install -g "vercel@${VERCEL_CLI_VERSION:?Set VERCEL_CLI_VERSION to an exact reviewed version}"

      - name: Pull Vercel project configuration
        if: steps.deployment_gate.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_sbMZdMfCJOIAyvuKQ1bSLvRe
          VERCEL_PROJECT_ID: prj_X1WqTn0Hra2IMdsx2wmLIS7mCuSA
        run: vercel pull --yes --environment=production --cwd human-signal-site

      - name: Deploy tested site to the existing production project
        if: steps.deployment_gate.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_sbMZdMfCJOIAyvuKQ1bSLvRe
          VERCEL_PROJECT_ID: prj_X1WqTn0Hra2IMdsx2wmLIS7mCuSA
        run: vercel deploy --yes --prod --cwd human-signal-site
